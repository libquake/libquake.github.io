# Builds the site with the docs from libquake and the Unity package and publishes it.
# Runs on a push here, daily, by hand, or on a repository_dispatch of type "docs".
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [docs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: libquake/libquake, path: repos/libquake, sparse-checkout: "docs\nexamples", sparse-checkout-cone-mode: false }
      - uses: actions/checkout@v4
        with: { repository: libquake/unity, path: repos/unity, sparse-checkout: docs }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node build.mjs
        env: { REPOS: repos }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
